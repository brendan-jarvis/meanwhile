# Build and attach platform binaries to a GitHub Release when a version tag is pushed.
#
#   git tag v0.5.0 && git push origin v0.5.0
#
# Or re-publish from main (Actions → Release → Run workflow) with a tag name.
# People can download the binary for their OS without installing Rust / cargo.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.5.0). Leave empty to build artifacts only."
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native Windows is not supported yet (Unix termios / raw TTY APIs).
          # Windows users can run the Linux binary under WSL.
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: meanwhile
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bin: meanwhile
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            bin: meanwhile
          # Cross-compile Intel from Apple Silicon runners (macos-13 is scarce / retiring).
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            bin: meanwhile

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          STAGE="meanwhile-${{ matrix.target }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" dist/meanwhile
          chmod +x dist/meanwhile
          cp README.md LICENSE dist/
          tar -C dist -czf "${STAGE}.tar.gz" meanwhile README.md LICENSE
          ls -lh "${STAGE}.tar.gz"
          echo "ASSET=${STAGE}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f -name '*.tar.gz' -exec cp -v {} release-assets/ \;
          ls -la release-assets
          test "$(find release-assets -name '*.tar.gz' | wc -l)" -ge 1

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: meanwhile ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
